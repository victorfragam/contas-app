<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="theme-color" content="#FCFCFA">
<title>Contas</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{background:#FCFCFA;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#2C2A25}
#root{height:100dvh;width:100vw;display:flex;flex-direction:column}
button{font-family:inherit}
input,select{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:0;height:0}
.scroll{-webkit-overflow-scrolling:touch}
@keyframes sheetUp{from{transform:translateY(101%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const React = window.React, ReactDOM = window.ReactDOM, h = React.createElement;

const BG = '#FCFCFA', TEXT = '#2C2A25', MUTE = '#A8A49A', SUB = '#8A867C';
const FAINT = '#EEEDE6', LINE = '#E6E4DD', PANEL = '#F4F3EE';
const SAGE = '#B6E000', SAGEBG = '#F5FCD6';
const RED = '#C2604A', AMBER = '#BE8A3C', BLUE = '#6E89B0';

const CATS = {
  moradia:{label:'Moradia'}, cartao:{label:'Cartão'}, streaming:{label:'Streaming'},
  saude:{label:'Saúde'}, cnpj:{label:'CNPJ'}, mae:{label:'Mãe'}, outros:{label:'Outros'}
};
const CATKEYS = Object.keys(CATS);
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WDH = ['seg','ter','qua','qui','sex','sáb','dom'];
const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const STORE = 'contasApp.v3';
const TODAY = {y:2026, m:6, d:22};
const CUR = '2026-06';

const brl = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const parseAmt = s => {
  if (typeof s === 'number') return s;
  s = String(s||'').trim().replace(/\s/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
};
const mIdx = k => { if(!k) return 0; const p = k.split('-').map(Number); return p[0]*12 + (p[1]-1); };
const kFromI = i => Math.floor(i/12) + '-' + String((i%12)+1).padStart(2,'0');
const seed = () => ({ bills: [], payments: {} });
const load = () => { try { const r = localStorage.getItem(STORE); if (r) return JSON.parse(r); } catch(e){} return null; };
const persist = s => { try { localStorage.setItem(STORE, JSON.stringify({bills:s.bills, payments:s.payments})); } catch(e){} };

const LB = {fontSize:12, fontWeight:600, letterSpacing:'.07em', textTransform:'uppercase', color:MUTE};

class App extends React.Component {
  constructor(props) {
    super(props);
    const sv = load(), sd = seed();
    this.state = {
      bills: sv ? sv.bills : sd.bills,
      payments: sv ? sv.payments : sd.payments,
      offset: 0, tab: 'mes', hl: 'lista', cl: 'mes',
      sheet: false, editing: false, form: this.blank('pay'),
      dayOpen: false, daySel: null, payOpen: false, pp: null
    };
  }
  blank(t){ return {id:null,type:t,name:'',category:'outros',amount:'',dueDay:'',recurring:true,variable:false,installment:false,installmentTotal:'12',installmentCurrent:'1'}; }
  save(){ persist(this.state); }

  vk(){ const i=(TODAY.m-1)+this.state.offset, y=TODAY.y+Math.floor(i/12), m=((i%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
  inst(key,type){
    return this.state.bills.filter(b => {
      if (b.type !== type) return false;
      if (b.recurring) return true;
      if (b.installment){ const n = mIdx(key) - mIdx(b.startMonth||key); return n>=0 && n<(b.installmentTotal||1); }
      return b.month === key;
    });
  }
  eff(b,key){ const p=this.state.payments[b.id+':'+key]; if(p&&p.paid&&p.amount!=null) return Number(p.amount); return Number(b.amount)||0; }
  sta(b,key){
    const p=this.state.payments[b.id+':'+key], paid=!!(p&&p.paid), rec=b.type==='receive';
    if(paid) return {k:'pago',color:SAGE,label:rec?'Recebido':'Pago'};
    if(key<CUR) return {k:'atrasado',color:RED,label:'Atrasado'};
    if(key===CUR && b.dueDay<TODAY.d) return {k:'atrasado',color:RED,label:'Atrasado'};
    if(key===CUR){ const d=b.dueDay-TODAY.d; if(d<=3) return {k:'breve',color:AMBER,label:d===0?(rec?'Hoje':'Vence hoje'):((rec?'Em ':'Vence ')+(d)+'d')}; }
    return {k:'avencer',color:MUTE,label:rec?'A receber':'A vencer'};
  }
  row(b,key){
    const cat=CATS[b.category]||CATS.outros, st=this.sta(b,key);
    const paid=st.k==='pago', ef=this.eff(b,key), est=b.variable&&!paid;
    let inst=''; if(b.installment){ const n=mIdx(key)-mIdx(b.startMonth||key)+1; inst=n+'/'+(b.installmentTotal||'?'); }
    return {id:b.id, bill:b, name:b.name, cat, inst, paid, st, dueDay:b.dueDay, amt:(est?'~ ':'')+brl(est?b.amount:ef)};
  }
  toggle(b,key,e){
    if(e) e.stopPropagation();
    const k=b.id+':'+key, p=this.state.payments[k];
    if(p&&p.paid){ const np={...this.state.payments}; delete np[k]; this.setState({payments:np}, ()=>this.save()); return; }
    if(b.variable){ this.setState({payOpen:true, pp:{id:b.id, key, name:b.name, value:String(b.amount).replace('.',',')}}); return; }
    this.pay(b.id, key, Number(b.amount)||0);
  }
  pay(id,key,amount){ this.setState({payments:{...this.state.payments,[id+':'+key]:{paid:true,amount}}}, ()=>this.save()); }
  edit(b){
    const cur = b.installment ? String(mIdx(this.vk())-mIdx(b.startMonth||this.vk())+1) : '1';
    this.setState({sheet:true, editing:true, form:{id:b.id,type:b.type,name:b.name,category:b.category,amount:String(b.amount).replace('.',','),dueDay:String(b.dueDay),recurring:!!b.recurring,variable:!!b.variable,installment:!!b.installment,installmentTotal:String(b.installmentTotal||'12'),installmentCurrent:cur}});
  }
  add(){ const t=this.state.tab==='receber'?'receive':'pay'; this.setState({sheet:true, editing:false, form:this.blank(t)}); }
  set(patch){ this.setState({form:{...this.state.form, ...patch}}); }
  commit(){
    const f=this.state.form, name=(f.name||'').trim(); if(!name) return;
    const dd=Math.max(1,Math.min(31,parseInt(f.dueDay,10)||1)), key=this.vk();
    const o={id:f.id||('u'+Date.now()),name,category:f.category,amount:parseAmt(f.amount),dueDay:dd,type:f.type,recurring:!f.installment&&!!f.recurring,variable:!f.installment&&!!f.variable,installment:!!f.installment};
    if(o.installment){ const cur=parseInt(f.installmentCurrent)||1; o.installmentTotal=parseInt(f.installmentTotal)||1; o.startMonth=kFromI(mIdx(key)-(cur-1)); }
    else if(!o.recurring){ o.month=key; }
    let bills=this.state.bills.slice(), i=bills.findIndex(x=>x.id===o.id);
    if(i>=0) bills[i]=o; else bills.push(o);
    this.setState({bills, sheet:false}, ()=>this.save());
  }
  del(){
    const id=this.state.form.id; if(!id){ this.setState({sheet:false}); return; }
    const bills=this.state.bills.filter(b=>b.id!==id), np={};
    Object.keys(this.state.payments).forEach(k=>{ if(k.split(':')[0]!==id) np[k]=this.state.payments[k]; });
    this.setState({bills, payments:np, sheet:false}, ()=>this.save());
  }

  // ---- pieces ----
  iconBtn(label,onClick){ return h('button',{onClick,style:{width:40,height:40,border:'none',background:PANEL,borderRadius:'50%',cursor:'pointer',fontSize:19,fontWeight:500,color:SUB,display:'flex',alignItems:'center',justifyContent:'center'}},label); }

  bigNum(label,value,sub,pct){
    return h('div',{style:{marginBottom:30}},
      h('div',{style:{fontSize:15,fontWeight:500,color:SUB}}, label),
      h('div',{style:{fontSize:46,fontWeight:500,color:TEXT,letterSpacing:'-.03em',lineHeight:1,marginTop:5}}, value),
      sub && h('div',{style:{fontSize:15,fontWeight:500,color:MUTE,marginTop:7}}, sub),
      h('div',{style:{height:4,borderRadius:2,background:LINE,overflow:'hidden',marginTop:20}},
        h('div',{style:{height:'100%',width:pct+'%',background:SAGE,borderRadius:2,transition:'width .35s ease'}})
      )
    );
  }

  card(r,key){
    return h('div',{key:r.id, onClick:()=>this.edit(r.bill), style:{display:'flex',alignItems:'center',gap:14,padding:'16px 0',borderBottom:'1px solid '+FAINT,cursor:'pointer'}},
      h('button',{onClick:e=>this.toggle(r.bill,key,e), style:{width:24,height:24,flex:'none',borderRadius:'50%',border:'1.5px solid '+(r.paid?SAGE:'#D6D3C9'),background:r.paid?SAGE:'transparent',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,cursor:'pointer'}}, r.paid?'✓':''),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontSize:17,fontWeight:500,color:r.paid?MUTE:TEXT,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, r.name),
        h('div',{style:{fontSize:13,fontWeight:500,color:r.st.color,marginTop:2}}, r.st.label + ' · dia ' + r.dueDay + (r.inst ? (' · ' + r.inst) : ''))
      ),
      h('div',{style:{fontSize:17,fontWeight:500,color:r.paid?'#C2BEB3':TEXT,textDecoration:r.paid?'line-through':'none',flex:'none'}}, r.amt)
    );
  }

  seg(items, val, onPick){
    return h('div',{style:{display:'flex',gap:8}},
      items.map(it => h('button',{key:it.v, onClick:()=>onPick(it.v), style:{padding:'8px 16px',fontSize:13.5,fontWeight:600,cursor:'pointer',border:'none',borderRadius:20,background:val===it.v?SAGEBG:'transparent',color:val===it.v?SAGE:MUTE}}, it.l))
    );
  }

  tabMes(key){
    const pi=this.inst(key,'pay').slice().sort((a,b)=>a.dueDay-b.dueDay);
    let tot=0,ps=0;
    pi.forEach(b=>{ const e=this.eff(b,key); tot+=e; if(this.sta(b,key).k==='pago') ps+=e; });
    const pct=tot>0?Math.round(ps/tot*100):0;
    const rows=pi.map(b=>this.row(b,key));
    const order=['atrasado','breve','avencer','pago'], titles={atrasado:'Atrasadas',breve:'Vence em breve',avencer:'A vencer',pago:'Pagas'}, gc={atrasado:RED,breve:AMBER,avencer:MUTE,pago:SAGE};
    const groups=order.map(k=>{ const it=rows.filter(r=>r.st.k===k); return it.length?{k,title:titles[k],color:gc[k],items:it}:null; }).filter(Boolean);
    return h('div',null,
      this.bigNum('Falta pagar', brl(tot-ps), 'de ' + brl(tot), pct),
      h('div',{style:{marginBottom:6}}, this.seg([{v:'lista',l:'Lista'},{v:'status',l:'Por status'},{v:'categoria',l:'Por categoria'}], this.state.hl, v=>this.setState({hl:v}))),
      rows.length===0
        ? h('div',{style:{textAlign:'center',padding:'56px 20px'}},
            h('div',{style:{fontSize:19,fontWeight:600,color:TEXT,marginBottom:6}}, 'Nenhuma conta'),
            h('div',{style:{fontSize:14,color:MUTE}}, 'Toque no + para cadastrar sua primeira conta')
          )
        : this.state.hl==='lista'
        ? h('div',null, rows.map(r=>this.card(r,key)))
        : this.state.hl==='status'
        ? h('div',null, groups.map(g=>
            h('div',{key:g.k,style:{marginBottom:10}},
              h('div',{style:{...LB,color:g.color,padding:'18px 0 2px'}}, g.title + ' · ' + g.items.length),
              g.items.map(r=>this.card(r,key))
            )
          ))
        : h('div',null, CATKEYS.map(k=>{
            const items=rows.filter(r=>r.bill.category===k);
            if(!items.length) return null;
            const total=items.reduce((sum,r)=>sum+(Number(this.eff(r.bill,key))||0),0);
            return h('div',{key:k,style:{marginBottom:10}},
              h('div',{style:{...LB,color:SUB,padding:'18px 0 2px'}}, CATS[k].label + ' · ' + items.length + ' · ' + brl(total)),
              items.map(r=>this.card(r,key))
            );
          }))
    );
  }

  tabCal(key){
    const [yy,mm]=key.split('-').map(Number);
    const pi=this.inst(key,'pay').slice().sort((a,b)=>a.dueDay-b.dueDay);
    const byDay={}; pi.forEach(b=>{ (byDay[b.dueDay]=byDay[b.dueDay]||[]).push(b); });
    const lead=(new Date(yy,mm-1,1).getDay()+6)%7, dim=new Date(yy,mm,0).getDate();
    const segEl = h('div',{style:{marginBottom:22}}, this.seg([{v:'mes',l:'Mês'},{v:'agenda',l:'Agenda'}], this.state.cl, v=>this.setState({cl:v})));
    if(this.state.cl==='mes'){
      const cells=[];
      for(let i=0;i<42;i++){
        const dn=i-lead+1;
        if(dn<1||dn>dim){ cells.push(h('div',{key:i,style:{aspectRatio:'1'}})); continue; }
        const isT=key===CUR&&dn===TODAY.d, list=byDay[dn]||[];
        let dot=null;
        if(list.length){ const sts=list.map(b=>this.sta(b,key).k);
          let c=SAGE;
          if(sts.indexOf('atrasado')>=0) c=RED;
          else if(sts.indexOf('breve')>=0) c=AMBER;
          else if(sts.every(s=>s==='pago')) c=SAGE;
          else c='#CFCBC0';
          dot=h('span',{style:{width:5,height:5,borderRadius:'50%',background:c}});
        }
        cells.push(h('div',{key:i, onClick:()=>list.length&&this.setState({dayOpen:true,daySel:dn}), style:{aspectRatio:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,cursor:list.length?'pointer':'default'}},
          h('span',{style: isT ? {width:30,height:30,borderRadius:'50%',background:SAGE,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:600} : {fontSize:14,fontWeight:500,color:list.length?TEXT:'#C2BEB3'}}, dn),
          dot
        ));
      }
      return h('div',null,
        segEl,
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}},
          WDH.map(w=>h('div',{key:w,style:{textAlign:'center',padding:'0 0 8px',...LB,fontSize:11}}, w)),
          cells
        ),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:14,marginTop:22,paddingTop:18,borderTop:'1px solid '+FAINT}},
          [[SAGE,'Pago'],[RED,'Atrasado'],[AMBER,'Vence em breve'],['#CFCBC0','A vencer']].map(p=>
            h('div',{key:p[1],style:{display:'flex',alignItems:'center',gap:7}},
              h('span',{style:{width:8,height:8,borderRadius:'50%',background:p[0]}}),
              h('span',{style:{fontSize:13,fontWeight:500,color:SUB}}, p[1])
            ))
        )
      );
    }
    const days=Object.keys(byDay).map(Number).sort((a,b)=>a-b);
    return h('div',null,
      segEl,
      days.length===0
        ? h('div',{style:{textAlign:'center',padding:'56px 20px',fontSize:14,color:MUTE}}, 'Nenhuma conta neste mês')
        : h('div',{style:{display:'flex',flexDirection:'column',gap:22}}, days.map(d=>{
            const wd=new Date(yy,mm-1,d).getDay(), isT=key===CUR&&d===TODAY.d;
            return h('div',{key:d,style:{display:'flex',gap:16}},
              h('div',{style:{flex:'none',width:46,textAlign:'center',paddingTop:14}},
                h('div',{style:{fontSize:24,fontWeight:600,color:isT?SAGE:TEXT,lineHeight:1}}, d),
                h('div',{style:{...LB,fontSize:10,marginTop:4,color:isT?SAGE:MUTE}}, WD[wd])
              ),
              h('div',{style:{flex:1,minWidth:0}}, byDay[d].map(b=>this.card(this.row(b,key),key)))
            );
          }))
    );
  }

  tabReceber(key){
    const ri=this.inst(key,'receive').slice().sort((a,b)=>a.dueDay-b.dueDay);
    let rt=0,rg=0; ri.forEach(b=>{ const e=this.eff(b,key); rt+=e; if(this.sta(b,key).k==='pago') rg+=e; });
    const pct=rt>0?Math.round(rg/rt*100):0;
    return h('div',null,
      this.bigNum('A receber', brl(rt-rg), 'de ' + brl(rt), pct),
      ri.length===0
        ? h('div',{style:{textAlign:'center',padding:'40px 20px',fontSize:14,color:MUTE}}, 'Nenhuma entrada cadastrada')
        : h('div',null, ri.map(b=>this.card(this.row(b,key),key)))
    );
  }

  navItem(id,label){
    const a=this.state.tab===id;
    return h('button',{onClick:()=>this.setState({tab:id}), style:{background:'none',border:'none',cursor:'pointer',fontSize:14.5,fontWeight:a?600:500,color:a?TEXT:MUTE,borderBottom:'2px solid '+(a?SAGE:'transparent'),paddingBottom:4}}, label);
  }

  // ---- overlays ----
  toggleRow(title,sub,on,fn){
    return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 0',borderBottom:'1px solid '+FAINT}},
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:15,color:TEXT}}, title),
        h('div',{style:{fontWeight:400,fontSize:13,color:MUTE,marginTop:1}}, sub)
      ),
      h('button',{onClick:fn,style:{width:50,height:30,borderRadius:16,border:'none',background:on?SAGE:'#DBD8CE',position:'relative',cursor:'pointer',transition:'background .2s'}},
        h('span',{style:{position:'absolute',top:3,left:on?23:3,width:24,height:24,borderRadius:'50%',background:'#fff',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}})
      )
    );
  }

  sheetEl(){
    const f=this.state.form, editing=this.state.editing;
    const LBL={display:'block',fontSize:13,fontWeight:600,color:SUB,marginBottom:7};
    const INP={width:'100%',border:'1px solid '+LINE,borderRadius:12,padding:'13px 14px',fontWeight:500,fontSize:16,background:'#fff',color:TEXT,outline:'none',display:'block',marginBottom:16};
    return h('div',{style:{position:'absolute',inset:0,zIndex:30,display:'flex',flexDirection:'column',justifyContent:'flex-end'}},
      h('div',{onClick:()=>this.setState({sheet:false}),style:{position:'absolute',inset:0,background:'rgba(44,42,37,.32)',animation:'fadeIn .2s ease'}}),
      h('div',{className:'scroll',style:{position:'relative',background:BG,borderTopLeftRadius:26,borderTopRightRadius:26,maxHeight:'92%',overflowY:'auto',padding:'10px 22px calc(34px + env(safe-area-inset-bottom))',animation:'sheetUp .28s cubic-bezier(.2,.8,.2,1)'}},
        h('div',{style:{width:40,height:5,borderRadius:3,background:LINE,margin:'6px auto 18px'}}),
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},
          h('h2',{style:{margin:0,fontWeight:600,fontSize:24,letterSpacing:'-.01em',color:TEXT}}, editing?'Editar conta':'Nova conta'),
          this.iconBtn('✕', ()=>this.setState({sheet:false}))
        ),
        h('div',{style:{marginBottom:20}}, this.seg([{v:'pay',l:'Pagar'},{v:'receive',l:'Receber'}], f.type, v=>this.set({type:v}))),
        h('label',{style:LBL},'Nome'),
        h('input',{value:f.name, onChange:e=>this.set({name:e.target.value}), placeholder:'Ex: Conta de luz', style:INP}),
        h('label',{style:LBL},'Categoria'),
        h('select',{value:f.category, onChange:e=>this.set({category:e.target.value}), style:{...INP,WebkitAppearance:'none',appearance:'none'}}, CATKEYS.map(k=>h('option',{key:k,value:k}, CATS[k].label))),
        h('div',{style:{display:'flex',gap:12,marginBottom:16}},
          h('div',{style:{flex:1.4}},
            h('label',{style:LBL}, f.installment?'Valor parcela':(f.variable?'Valor estimado':'Valor')),
            h('input',{value:f.amount, onChange:e=>this.set({amount:e.target.value}), inputMode:'decimal', placeholder:'0,00', style:{...INP,marginBottom:0}})
          ),
          h('div',{style:{flex:1}},
            h('label',{style:LBL},'Dia'),
            h('input',{value:f.dueDay, onChange:e=>this.set({dueDay:e.target.value}), inputMode:'numeric', placeholder:'1–31', style:{...INP,marginBottom:0}})
          )
        ),
        h('div',{style:{height:6}}),
        this.toggleRow('Parcelado','Compra em parcelas fixas', f.installment, ()=>this.set({installment:!f.installment})),
        f.installment && h('div',{style:{display:'flex',gap:12,marginTop:14}},
          h('div',{style:{flex:1}}, h('label',{style:LBL},'Total parcelas'), h('input',{value:f.installmentTotal, onChange:e=>this.set({installmentTotal:e.target.value}), inputMode:'numeric', placeholder:'12', style:{...INP,marginBottom:0}})),
          h('div',{style:{flex:1}}, h('label',{style:LBL},'Parcela atual'), h('input',{value:f.installmentCurrent, onChange:e=>this.set({installmentCurrent:e.target.value}), inputMode:'numeric', placeholder:'1', style:{...INP,marginBottom:0}}))
        ),
        !f.installment && h('div',null,
          this.toggleRow('Recorrente','Repete todo mês', f.recurring, ()=>this.set({recurring:!f.recurring})),
          this.toggleRow('Valor muda todo mês','Luz, água, condomínio…', f.variable, ()=>this.set({variable:!f.variable}))
        ),
        h('div',{style:{height:24}}),
        h('button',{onClick:()=>this.commit(), style:{width:'100%',border:'none',background:SAGE,color:'#fff',borderRadius:14,padding:16,fontWeight:600,fontSize:16,cursor:'pointer'}}, 'Salvar'),
        editing && h('button',{onClick:()=>this.del(), style:{width:'100%',border:'none',background:'none',color:RED,padding:14,fontWeight:600,fontSize:14,cursor:'pointer',marginTop:6}}, 'Excluir conta')
      )
    );
  }

  dayEl(key){
    const [, mm]=key.split('-').map(Number);
    const list=(this.inst(key,'pay').filter(b=>b.dueDay===this.state.daySel)).slice().sort((a,b)=>a.dueDay-b.dueDay);
    return h('div',{style:{position:'absolute',inset:0,zIndex:28,display:'flex',flexDirection:'column',justifyContent:'flex-end'}},
      h('div',{onClick:()=>this.setState({dayOpen:false}),style:{position:'absolute',inset:0,background:'rgba(44,42,37,.32)',animation:'fadeIn .2s ease'}}),
      h('div',{className:'scroll',style:{position:'relative',background:BG,borderTopLeftRadius:26,borderTopRightRadius:26,maxHeight:'80%',overflowY:'auto',padding:'10px 22px calc(28px + env(safe-area-inset-bottom))',animation:'sheetUp .28s cubic-bezier(.2,.8,.2,1)'}},
        h('div',{style:{width:40,height:5,borderRadius:3,background:LINE,margin:'6px auto 18px'}}),
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}},
          h('h2',{style:{margin:0,fontWeight:600,fontSize:22,letterSpacing:'-.01em',color:TEXT}}, this.state.daySel+' de '+MONTHS[mm-1]),
          this.iconBtn('✕', ()=>this.setState({dayOpen:false}))
        ),
        h('div',null, list.map(b=>this.card(this.row(b,key),key)))
      )
    );
  }

  payEl(){
    const pp=this.state.pp; if(!pp) return null;
    const LBL={display:'block',fontSize:13,fontWeight:600,color:SUB,marginBottom:7};
    return h('div',{style:{position:'absolute',inset:0,zIndex:32,display:'flex',alignItems:'center',justifyContent:'center',padding:28}},
      h('div',{onClick:()=>this.setState({payOpen:false,pp:null}),style:{position:'absolute',inset:0,background:'rgba(44,42,37,.36)',animation:'fadeIn .2s ease'}}),
      h('div',{style:{position:'relative',width:'100%',maxWidth:360,background:BG,borderRadius:22,padding:24,animation:'fadeIn .2s ease'}},
        h('div',{style:{...LB,marginBottom:5}}, 'Marcar como pago'),
        h('h3',{style:{margin:'0 0 18px',fontWeight:600,fontSize:21,color:TEXT}}, pp.name),
        h('label',{style:LBL},'Quanto você pagou?'),
        h('input',{value:pp.value, onChange:e=>this.setState({pp:{...pp,value:e.target.value}}), inputMode:'decimal', placeholder:'0,00', autoFocus:true, style:{width:'100%',border:'1px solid '+LINE,borderRadius:12,padding:'14px 14px',fontWeight:600,fontSize:18,background:'#fff',color:TEXT,outline:'none',marginBottom:18}}),
        h('div',{style:{display:'flex',gap:10}},
          h('button',{onClick:()=>this.setState({payOpen:false,pp:null}), style:{flex:1,border:'1px solid '+LINE,background:'#fff',color:SUB,borderRadius:13,padding:14,fontWeight:600,fontSize:14,cursor:'pointer'}}, 'Cancelar'),
          h('button',{onClick:()=>{ this.pay(pp.id,pp.key,parseAmt(pp.value)); this.setState({payOpen:false,pp:null}); }, style:{flex:1.4,border:'none',background:SAGE,color:'#fff',borderRadius:13,padding:14,fontWeight:600,fontSize:14,cursor:'pointer'}}, 'Confirmar')
        )
      )
    );
  }

  render(){
    const {tab,sheet,dayOpen,payOpen}=this.state;
    const key=this.vk(), parts=key.split('-').map(Number), yy=parts[0], mm=parts[1];
    let body;
    if(tab==='mes') body=this.tabMes(key);
    else if(tab==='cal') body=this.tabCal(key);
    else body=this.tabReceber(key);

    return h('div',{style:{position:'relative',height:'100dvh',width:'100%',maxWidth:520,margin:'0 auto',background:BG,display:'flex',flexDirection:'column',overflow:'hidden'}},
      h('header',{style:{padding:'calc(16px + env(safe-area-inset-top)) 22px 14px',flex:'none',background:BG}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
          h('div',{style:{display:'flex',gap:10}}, this.iconBtn('‹', ()=>this.setState({offset:this.state.offset-1})), this.iconBtn('›', ()=>this.setState({offset:this.state.offset+1}))),
          key!==CUR && h('button',{onClick:()=>this.setState({offset:0}), style:{padding:'9px 16px',border:'none',background:SAGEBG,color:SAGE,borderRadius:18,fontSize:13,fontWeight:600,cursor:'pointer'}}, 'Hoje')
        ),
        h('div',{style:{display:'flex',alignItems:'baseline',gap:9}},
          h('h1',{style:{margin:0,fontWeight:600,fontSize:25,letterSpacing:'-.01em',color:TEXT}}, MONTHS[mm-1]),
          h('span',{style:{fontSize:16,fontWeight:500,color:MUTE}}, yy)
        )
      ),
      h('main',{className:'scroll',style:{flex:1,overflowY:'auto',padding:'14px 22px calc(112px + env(safe-area-inset-bottom))'}}, body),
      h('button',{onClick:()=>this.add(), style:{position:'absolute',right:22,bottom:'calc(100px + env(safe-area-inset-bottom))',width:58,height:58,borderRadius:'50%',border:'none',background:SAGE,color:'#fff',fontSize:30,fontWeight:400,cursor:'pointer',zIndex:8,boxShadow:'0 10px 26px -8px rgba(182,224,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1,paddingBottom:3}}, '+'),
      h('nav',{style:{flex:'none',background:BG,borderTop:'1px solid '+FAINT,display:'flex',alignItems:'center',justifyContent:'center',gap:44,padding:'15px 8px calc(15px + env(safe-area-inset-bottom))'}},
        this.navItem('mes','Mês'), this.navItem('cal','Agenda'), this.navItem('receber','Receber')
      ),
      sheet && this.sheetEl(),
      dayOpen && this.dayEl(key),
      payOpen && this.payEl()
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('skipWaiting');
            window.location.reload();
          }
        });
      });
    }).catch(() => {});
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return; refreshing = true; window.location.reload();
    });
  });
}
</script>
</body>
</html>
